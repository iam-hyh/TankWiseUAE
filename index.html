<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TankWise UAE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B1220; --card:#121D2E; --card2:#15223A; --accent:#A3E635; --accent2:#D9F99D;
  --text:#F5F7FA; --muted:#8B98AC; --border:#22304A; --danger:#F87171;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;touch-action:manipulation;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
body.ar{font-family:'Tajawal','Inter',-apple-system,sans-serif;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:84px;}
main{padding:20px 16px 20px;}
.view{display:none;animation:fade .2s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.row{display:flex;justify-content:space-between;align-items:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat{background:var(--card2,#15223a);border-radius:14px;padding:12px;}
.stat .n{font-size:20px;font-weight:800;color:var(--accent);}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
.big{font-size:30px;font-weight:800;}
.pill{display:inline-block;background:rgba(163,230,53,.14);color:var(--accent);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.pill.muted{background:rgba(139,152,172,.14);color:var(--muted);}
label{font-size:12.5px;color:var(--muted);display:block;margin:10px 0 5px;}
input,select{width:100%;background:#0E1A2C;border:1px solid var(--border);color:var(--text);padding:12px 12px;border-radius:12px;font-size:15px;font-family:inherit;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
input:disabled{opacity:.5;cursor:not-allowed;}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--accent);color:#0B1220;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-danger{background:rgba(248,113,113,.12);color:var(--danger);border:1px solid rgba(248,113,113,.3);}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.tabbar{display:flex;background:#0E1A2C;border-radius:12px;padding:4px;margin-bottom:14px;}
.tabbar button{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);border-radius:9px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;}
.tabbar button.active{background:var(--accent);color:#0B1220;}
.vcard{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;}
.vcard.selected{border-color:var(--accent);background:rgba(163,230,53,.06);}
.hist-item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.hist-item:last-child{border-bottom:none;}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(18,29,46,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;}
nav.bottom button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer;}
nav.bottom button.active{color:var(--accent);}
nav.bottom .ic{display:flex;}
nav.bottom .ic svg{width:21px;height:21px;}
.qa-ic{color:var(--accent);}
.qa-ic svg{width:26px;height:26px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}
.small{font-size:11.5px;color:var(--muted);}
.result-hero{background:linear-gradient(135deg,rgba(163,230,53,.12),rgba(163,230,53,.03));border:1px solid rgba(163,230,53,.25);border-radius:16px;padding:16px;margin-top:12px;}
.lang-row{display:flex;gap:10px;margin-top:6px;}
.lang-btn,.econ-unit-btn,.v-econ-unit-btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:#0E1A2C;color:var(--text);font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;}
.lang-btn.active,.econ-unit-btn.active,.v-econ-unit-btn.active{border-color:var(--accent);background:rgba(163,230,53,.1);color:var(--accent);}
.grade-row{display:flex;gap:8px;}
.grade-btn{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:#0E1A2C;color:var(--text);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
.grade-btn.active{border-color:var(--accent);background:rgba(163,230,53,.1);color:var(--accent);}
.grade-btn .gname{font-size:12px;font-weight:700;}
.grade-btn .grate{font-size:10.5px;color:var(--muted);}
.grade-btn.active .grate{color:var(--accent2);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.settings-row:last-child{border-bottom:none;}
.settings-row .srow-title{font-weight:600;font-size:14.5px;}
.settings-row .srow-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.settings-row .chev{color:var(--muted);font-size:16px;}
.settings-back{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.settings-back button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:4px;display:flex;}
.settings-back h2{margin:0;font-size:17px;font-weight:800;}
[dir="rtl"] .settings-back .backBtn i{transform:scaleX(-1);display:inline-block;}
</style>
</head>

  </nav>
</div>

};
const DEMO_VEHICLE={id:'demo1',name:'My Corolla',make:'Toyota',model:'Corolla Hybrid',year:2025,tank:43,economy:20.9,grade:'Special 95',demo:true};
const DEMO_PRICES={'E-Plus 91':3.97,'Special 95':4.04,'Super 98':4.16,effective:'November 2026',updated:'Demo data — set manually in Settings',manual:true};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let state={
  vehicles: load('tw_vehicles',[DEMO_VEHICLE]),
  trips: load('tw_trips',[]),
  prices: load('tw_prices',DEMO_PRICES),
  activeVehicleId: load('tw_active', DEMO_VEHICLE.id),
  refills: load('tw_refills',[]),
  lang: load('tw_lang','en'),
  calcTab:'trip', view:'home', historyTab:'trips', settingsPage:'main'
};
function t(k){return (I18N[state.lang]&&I18N[state.lang][k])||I18N.en[k]||k;}
function persist(){save('tw_vehicles',state.vehicles);save('tw_trips',state.trips);save('tw_refills',state.refills);save('tw_prices',state.prices);save('tw_active',state.activeVehicleId);save('tw_lang',state.lang);}
function aed(n){return 'AED '+(isFinite(n)?n:0).toFixed(2);}
function activeVehicle(){return state.vehicles.find(v=>v.id===state.activeVehicleId)||state.vehicles[0];}
function priceFor(grade){return state.prices[grade]??0;}

function applyLangChrome(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('ar',state.lang==='ar');
  document.title=t('appName');
  document.querySelectorAll('.navlbl').forEach(el=>el.textContent=t(el.dataset.k));
}

function setView(v){state.view=v;if(v==='settings')state.settingsPage='main';document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render();}
document.querySelectorAll('nav.bottom button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

function render(){
  applyLangChrome();
  const m=document.getElementById('main');
  if(state.view==='home') m.innerHTML=homeView();
  else if(state.view==='calc') m.innerHTML=calcView();
  else if(state.view==='history') m.innerHTML=historyView();
  else if(state.view==='settings') m.innerHTML=settingsView();
  bindDynamic();
}

function homeView(){
  const v=activeVehicle();
  const trips=state.trips;
  const monthSpend=trips.filter(tr=>tr.date.slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,tr)=>s+tr.cost,0);
  const recent=trips.slice(-3).reverse();
  return `
  <div class="card">
    <div class="row"><div>
      <div class="small">${t('selectedVehicle')}</div>
      <div style="font-size:17px;font-weight:700;margin-top:2px;">${v?v.name:t('noVehicle')}</div>
    </div><span class="pill">${v?v.grade:''}</span></div>
  </div>
  <div class="card">
    <h3>${t('petrolPrices')} <span class="pill ${state.prices.manual?'muted':''}">${state.prices.manual?t('manualDemo'):t('live')}</span></h3>
    <div class="grid3">
      ${['E-Plus 91','Special 95','Super 98'].map(g=>`<div class="stat"><div class="n">${priceFor(g).toFixed(2)}</div><div class="l">${g}</div></div>`).join('')}
    </div>
    <div class="small" style="margin-top:10px;">${t('effective')} ${state.prices.effective} · ${state.prices.updated}</div>
  </div>
  <div class="grid2">

function bindDynamic(){
  const tt=document.getElementById('tabTrip'), tf=document.getElementById('tabFill');
  if(tt) tt.onclick=()=>{state.calcTab='trip';render();};
  if(tf) tf.onclick=()=>{state.calcTab='fill';render();};

  const ctb=document.getElementById('calcTripBtn');
  document.querySelectorAll('.econ-unit-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.econ-unit-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const unit=b.dataset.unit;
    const hidden=document.getElementById('t_econ_unit');
    if(hidden.value!==unit){
      const econInput=document.getElementById('t_econ');
      const val=parseFloat(econInput.value);
      if(val>0) econInput.value=(100/val).toFixed(2);
    }
    hidden.value=unit;
  });
  document.querySelectorAll('.t-grade-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.t-grade-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('t_grade').value=b.dataset.grade;
  });
  if(ctb) ctb.onclick=()=>{
    const name=document.getElementById('t_name').value.trim();
    const dist=parseFloat(document.getElementById('t_dist').value)||0;
    const econRaw=parseFloat(document.getElementById('t_econ').value)||0;
    const econUnit=document.getElementById('t_econ_unit').value;
    const econ=econUnit==='l100'?(econRaw>0?100/econRaw:0):econRaw;
    const grade=document.getElementById('t_grade').value;
    const level=parseFloat(document.getElementById('t_level').value);
    if(dist<=0||econ<=0){document.getElementById('tripResult').innerHTML=`<div class="card"><div class="empty">${t('validDistEcon')}</div></div>`;return;}
    const fuelNeeded=dist/econ;
    const price=priceFor(grade);
    const cost=fuelNeeded*price;
    const perKm=cost/dist;
    let remain='', remainRange='';
    if(!isNaN(level)){
      const after=level-fuelNeeded;
      remain=`<div class="row" style="margin-top:8px"><span class="small">${t('petrolRemaining')}</span><span>${after.toFixed(1)} L</span></div>`;
      remainRange=`<div class="row"><span class="small">${t('remainingRange')}</span><span>${Math.max(0,after*econ).toFixed(0)} km</span></div>`;
    }
    window._lastTrip={name,distance:dist,cost,grade,fuel:fuelNeeded,date:new Date().toISOString().slice(0,10)};
    document.getElementById('tripResult').innerHTML=`
    <div class="result-hero">
      <div class="small">${t('tripCost')}</div><div class="big">${aed(cost)}</div>
      <div class="row" style="margin-top:10px"><span class="small">${t('petrolNeeded')}</span><span>${fuelNeeded.toFixed(2)} L</span></div>
      <div class="row"><span class="small">${t('costPerKm')}</span><span>${aed(perKm)}</span></div>
      ${remain}${remainRange}
      <div class="btn-row">
        <button class="btn btn-ghost" id="saveTripBtn">${t('saveTrip')}</button>
        <button class="btn btn-ghost" id="shareTripBtn">${t('share')}</button>
      </div>
    </div>`;
    document.getElementById('saveTripBtn').onclick=()=>{
      state.trips.push({...window._lastTrip, id:Date.now()+''});
      persist();
      document.getElementById('saveTripBtn').textContent=t('saved');
    };
    document.getElementById('shareTripBtn').onclick=()=>{
      const txt=`TankWise UAE: ${dist} km, ${fuelNeeded.toFixed(2)} L, ${aed(cost)} (${grade})`;
      if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
      else{navigator.clipboard?.writeText(txt);document.getElementById('shareTripBtn').textContent=t('copied');}
    };
  };

  const cfb=document.getElementById('calcFillBtn');
  const fullBtn=document.getElementById('fullBtn');
  if(fullBtn) fullBtn.onclick=()=>{
    const hidden=document.getElementById('f_full');
    const isFull=hidden.value==='1';
    hidden.value=isFull?'0':'1';
    fullBtn.classList.toggle('active',!isFull);
    const amtInput=document.getElementById('f_amount');
    amtInput.disabled=!isFull;
  };
  document.querySelectorAll('.f-grade-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.f-grade-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('f_grade').value=b.dataset.grade;
  });
  if(cfb) cfb.onclick=()=>{
    const v=activeVehicle();
    const tank=parseFloat(document.getElementById('f_tank').value)||0;
    const distance=parseFloat(document.getElementById('f_distance').value);
    const econ=v?v.economy:0;
    let level=0;
    if(!isNaN(distance) && econ>0) level=Math.max(0, Math.min(tank, tank-(distance/econ)));
    const grade=document.getElementById('f_grade').value;
    const isFull=document.getElementById('f_full').value==='1';
    if(tank<=0){document.getElementById('fillResult').innerHTML=`<div class="card"><div class="empty">${t('validTank')}</div></div>`;return;}
    const price=priceFor(grade);
    const remainingCap=Math.max(0, tank-level);
    let litres=0, capped=false;
    if(isFull){
      litres=remainingCap;
    } else {
      const amount=parseFloat(document.getElementById('f_amount').value)||0;
      if(amount<=0){document.getElementById('fillResult').innerHTML=`<div class="card"><div class="empty">${t('validAmount')}</div></div>`;return;}
      litres=price>0?amount/price:0;
      if(litres>remainingCap){litres=remainingCap;capped=true;}
    }
    const cost=litres*price;
    const after=level+litres;
    const pct=tank>0?(after/tank*100).toFixed(0):0;
    window._lastFill={litres,cost,grade,date:new Date().toISOString().slice(0,10)};
    const cappedNote=capped?`<div class="small" style="margin-top:6px;">${t('cappedNote')}</div>`:'';
    document.getElementById('fillResult').innerHTML=`
    <div class="result-hero">
      <div class="small">${t('fillingCost')}</div><div class="big">${aed(cost)}</div>
      <div class="row" style="margin-top:10px"><span class="small">${t('litresRequired')}</span><span>${litres.toFixed(1)} L</span></div>
      <div class="row"><span class="small">${t('levelAfter')}</span><span>${after.toFixed(1)} L (${pct}%)</span></div>
      ${cappedNote}
      <div class="btn-row">
        <button class="btn btn-ghost" id="saveFillBtn">${t('saveRefill')}</button>
        <button class="btn btn-ghost" id="shareFillBtn">${t('share')}</button>
      </div>
    </div>`;
    document.getElementById('saveFillBtn').onclick=()=>{
      state.refills.push({...window._lastFill, id:Date.now()+''});
      persist();
      document.getElementById('saveFillBtn').textContent=t('saved');
    };
    document.getElementById('shareFillBtn').onclick=()=>{
      const txt=`TankWise UAE: ${litres.toFixed(1)} L, ${aed(cost)} (${grade})`;
      if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
      else{navigator.clipboard?.writeText(txt);document.getElementById('shareFillBtn').textContent=t('copied');}
    };
  };

  const htt=document.getElementById('histTripsTab'), htr=document.getElementById('histRefillTab');
  if(htt) htt.onclick=()=>{state.historyTab='trips';render();};
  if(htr) htr.onclick=()=>{state.historyTab='refill';render();};

  const qst=document.getElementById('quickSaveTripBtn');
  if(qst) qst.onclick=()=>{
    document.getElementById('calcTripBtn').click();
    const sb=document.getElementById('saveTripBtn');
    if(sb) sb.click();
  };
  const qsf=document.getElementById('quickSaveFillBtn');
  if(qsf) qsf.onclick=()=>{
    document.getElementById('calcFillBtn').click();
    const sb=document.getElementById('saveFillBtn');
    if(sb) sb.click();
  };

  bindVehicleEvents();
  bindSettingsEvents();
}

function bindVehicleEvents(){
  document.querySelectorAll('[data-select]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('button'))return;
    state.activeVehicleId=el.dataset.select;persist();render();
  });
  document.querySelectorAll('[data-del]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.vehicles=state.vehicles.filter(v=>v.id!==el.dataset.del);
    if(state.activeVehicleId===el.dataset.del && state.vehicles[0]) state.activeVehicleId=state.vehicles[0].id;
    persist();render();
  });
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const v=state.vehicles.find(x=>x.id===el.dataset.edit); if(!v)return;
    document.getElementById('formTitle').textContent=t('editVehicle');
    document.getElementById('v_id').value=v.id;
    document.getElementById('v_name').value=v.name;
    document.getElementById('v_make').value=v.make;
    document.getElementById('v_model').value=v.model;
    document.getElementById('v_year').value=v.year;
    document.getElementById('v_tank').value=v.tank;
    document.getElementById('v_econ').value=v.economy;
    document.getElementById('v_econ_unit').value='kml';
    document.querySelectorAll('.v-econ-unit-btn').forEach(b=>b.classList.toggle('active', b.dataset.unit==='kml'));
    document.getElementById('v_grade').value=v.grade;
    document.querySelectorAll('.v-grade-btn').forEach(b=>b.classList.toggle('active', b.dataset.grade===v.grade));
  });
  document.querySelectorAll('.v-econ-unit-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.v-econ-unit-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const unit=b.dataset.unit;
    const hidden=document.getElementById('v_econ_unit');
    if(hidden.value!==unit){
      const econInput=document.getElementById('v_econ');
      const val=parseFloat(econInput.value);
      if(val>0) econInput.value=(100/val).toFixed(2);
    }
    hidden.value=unit;
  });
  document.querySelectorAll('.v-grade-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.v-grade-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('v_grade').value=b.dataset.grade;
  });
  const sv=document.getElementById('saveVehicleBtn');
  if(sv) sv.onclick=()=>{
    const id=document.getElementById('v_id').value || Date.now()+'';
    const name=document.getElementById('v_name').value.trim();
    if(!name){alert(t('pleaseEnterName'));return;}
    const econRaw=parseFloat(document.getElementById('v_econ').value)||0;
    const econUnit=document.getElementById('v_econ_unit').value;
    const economy=econUnit==='l100'?(econRaw>0?100/econRaw:0):econRaw;
    const vh={id,name,make:document.getElementById('v_make').value,model:document.getElementById('v_model').value,
      year:parseInt(document.getElementById('v_year').value)||'',tank:parseFloat(document.getElementById('v_tank').value)||0,
      economy, grade:document.getElementById('v_grade').value};
    const idx=state.vehicles.findIndex(v=>v.id===id);
    if(idx>-1) state.vehicles[idx]=vh; else {state.vehicles.push(vh); state.activeVehicleId=id;}
    persist();render();
  };
}

function tripsHistoryView(){
  const trips=[...state.trips].reverse();
  const totalKm=state.trips.reduce((s,tr)=>s+tr.distance,0);
  const totalFuel=state.trips.reduce((s,tr)=>s+tr.fuel,0);
  const totalCost=state.trips.reduce((s,tr)=>s+tr.cost,0);
  const avgEcon=totalFuel>0?(totalKm/totalFuel).toFixed(1):'–';
  const avgPerKm=totalKm>0?(totalCost/totalKm):0;
  return `
  <div class="card"><h3>${t('analytics')}</h3>
    <div class="grid2">
      <div class="stat"><div class="n">${aed(totalCost)}</div><div class="l">${t('totalFuelSpend')}</div></div>
      <div class="stat"><div class="n">${totalKm.toFixed(0)} km</div><div class="l">${t('totalDistance')}</div></div>
      <div class="stat"><div class="n">${totalFuel.toFixed(1)} L</div><div class="l">${t('totalFuelUsed')}</div></div>
      <div class="stat"><div class="n">${aed(avgPerKm)}</div><div class="l">${t('avgCostKm')}</div></div>
    </div>
    <div class="small" style="margin-top:10px;">${t('avgEfficiency')}: ${avgEcon} km/L</div>
  </div>
  <div class="card"><h3>${t('allTrips')}</h3>
  ${trips.length? trips.map(tr=>`<div class="hist-item"><span>${tr.name?tr.name+' · ':''}${tr.date}</span><span>${tr.distance} km · ${tr.grade}</span><span>${aed(tr.cost)}</span></div>`).join('') : `<div class="empty">${t('noTrips')}</div>`}
  </div>`;
}
function refillHistoryView(){
  const refills=[...state.refills].reverse();
  const totalLitres=state.refills.reduce((s,r)=>s+r.litres,0);
  const totalCost=state.refills.reduce((s,r)=>s+r.cost,0);
  return `
  <div class="card"><h3>${t('analytics')}</h3>
    <div class="grid2">
      <div class="stat"><div class="n">${state.refills.length}</div><div class="l">${t('totalRefills')}</div></div>
      <div class="stat"><div class="n">${totalLitres.toFixed(1)} L</div><div class="l">${t('totalLitresAdded')}</div></div>

  ${refills.length? refills.map(r=>`<div class="hist-item"><span>${r.date}</span><span>${r.litres.toFixed(1)} L · ${r.grade}</span><span>${aed(r.cost)}</span></div>`).join('') : `<div class="empty">${t('noRefills')}</div>`}
  </div>`;
}

      <div><div class="srow-title">${t('preferences')}</div><div class="srow-sub">${t('currency')} \u00b7 ${t('kilometres')} \u00b7 ${t('dark')} \u00b7 ${t('language')}</div></div>
      <span class="chev">\u203a</span>
    </div>
  </div>
  <div class="card">
    <div class="row"><h3 style="margin:0">${t('myGarage')}</h3><span class="pill muted">${count} ${count===1?t('vehicleWord'):t('vehiclesWord')}</span></div>
    ${vehicleCard}
    <div class="settings-row" id="goGarageAdd" style="border-top:1px solid var(--border);margin-top:10px;padding-top:12px;">
      <div class="srow-title" style="color:var(--accent)">+ ${t('addAnotherVehicle')}</div>
    </div>
  </div>
  <div class="card">
    <div class="settings-row" id="goPrices">
      <div><div class="srow-title">${t('petrolPricesRow')}</div><div class="srow-sub">${t('managePricesDesc')}</div></div>
      <span class="pill ${state.prices.manual?'muted':''}">${state.prices.manual?t('manualDemo'):t('live')}</span>
    </div>
  </div>
  <div class="card">
    <h3>${t('dataSupport')}</h3>
    <div class="settings-row" id="clearHistBtn"><div class="srow-title" style="color:var(--danger)">${t('clearHistory')}</div></div>
    <div class="settings-row" id="exportCsvBtn"><div class="srow-title">${t('exportHistory')}</div></div>
    <div class="settings-row" id="goAbout"><div><div class="srow-title">${t('about')}</div></div><span class="chev">\u203a</span></div>
  </div>`;
}

  return backHeader('preferences')+`
  <div class="card">
    <div class="row"><span class="small">${t('currency')}</span><span class="pill">AED</span></div>
    <div class="row" style="margin-top:8px"><span class="small">${t('distanceUnit')}</span><span class="pill">${t('kilometres')}</span></div>
    <div class="row" style="margin-top:8px"><span class="small">${t('fuelUnit')}</span><span class="pill">${t('litres')}</span></div>
    <div class="row" style="margin-top:8px"><span class="small">${t('theme')}</span><span class="pill">${t('dark')}</span></div>
    <label>${t('defaultVehicle')}</label>
    <select id="s_default">${state.vehicles.map(v=>`<option value="${v.id}" ${v.id===state.activeVehicleId?'selected':''}>${v.name}</option>`).join('')}</select>
    <label>${t('language')}</label>
    <div class="lang-row">
      <button type="button" class="lang-btn ${state.lang==='en'?'active':''}" data-lang="en">English</button>
      <button type="button" class="lang-btn ${state.lang==='ar'?'active':''}" data-lang="ar">\u0627\u0644\u0639\u0631\u0628\u064a\u0629</button>
    </div>
  </div>`;
}

function garagePage(){
  return backHeader('myGarage')+vehiclesSection();
}

function pricesPage(){
  return backHeader('petrolPricesRow')+`
  <div class="card">
    <div class="small">${t('noBackend')}</div>
    ${['E-Plus 91','Special 95','Super 98'].map(g=>`<label>${g} (AED/L)</label><input type="number" step="0.01" class="price-input" data-grade="${g}" value="${priceFor(g)}">`).join('')}
    <label>${t('effectiveMonth')}</label><input id="s_eff" value="${state.prices.effective}">
    <button class="btn btn-primary" style="margin-top:14px" id="savePricesBtn">${t('savePrices')}</button>

function aboutPage(){
  return backHeader('about')+`
  <div class="card">
    <div class="row"><span class="small">${t('appVersionLbl')}</span><span class="pill">1.0.0</span></div>
    <div class="small" style="margin-top:10px;">${t('aboutDesc')}</div>
  </div>
  <div class="card">
    <h3>${t('support')}</h3>
    <div class="small">${t('supportDesc')}</div>
  </div>`;
}

function csvEscape(s){ s=String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
async function exportHistoryCsv(){
  const rows=[['Type','Date','Name','Distance (km)','Litres','Grade','Cost (AED)']];
  state.trips.forEach(tr=>rows.push(['Trip',tr.date,tr.name||'',tr.distance,tr.fuel.toFixed(2),tr.grade,tr.cost.toFixed(2)]));
  state.refills.forEach(r=>rows.push(['Refill',r.date,'','',r.litres.toFixed(2),r.grade,r.cost.toFixed(2)]));
  const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  try{
    const downloads=window.claude?await window.claude.use('downloads'):null;
    if(downloads){ await downloads.save({filename:'tankwise-history.csv', data:csv}); return; }
  }catch(e){}
  try{ await navigator.clipboard.writeText(csv); alert(t('csvExported')); }catch(e){}
}

function bindSettingsEvents(){
  const back=document.querySelector('.backBtn');
  if(back) back.onclick=()=>{state.settingsPage='main';render();};
  const goPref=document.getElementById('goPreferences');
  if(goPref) goPref.onclick=()=>{state.settingsPage='preferences';render();};
  const goGD=document.getElementById('goGarageDefault');
  if(goGD) goGD.onclick=()=>{state.settingsPage='garage';render();};
  const goGA=document.getElementById('goGarageAdd');
  if(goGA) goGA.onclick=()=>{state.settingsPage='garage';render();};
  const goPrices=document.getElementById('goPrices');
  if(goPrices) goPrices.onclick=()=>{state.settingsPage='prices';render();};
  const goAbout=document.getElementById('goAbout');
  if(goAbout) goAbout.onclick=()=>{state.settingsPage='about';render();};

  const sd=document.getElementById('s_default');
  if(sd) sd.onchange=(e)=>{state.activeVehicleId=e.target.value;persist();};
  document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{
    state.lang=b.dataset.lang; persist(); render();
  });
  const sp=document.getElementById('savePricesBtn');
  if(sp) sp.onclick=()=>{
    document.querySelectorAll('.price-input').forEach(inp=>{state.prices[inp.dataset.grade]=parseFloat(inp.value)||0;});
    state.prices.effective=document.getElementById('s_eff').value;
    state.prices.updated=(state.lang==='ar'?'\u062a\u062d\u062f\u064a\u062b \u064a\u062f\u0648\u064a \u0628\u062a\u0627\u0631\u064a\u062e ':'Manually updated ')+new Date().toLocaleDateString();
    state.prices.manual=true;
    persist();render();
  };
  const ch=document.getElementById('clearHistBtn');
  if(ch) ch.onclick=()=>{if(confirm(t('confirmClear'))){state.trips=[];state.refills=[];persist();render();}};
  const ex=document.getElementById('exportCsvBtn');
  if(ex) ex.onclick=()=>{exportHistoryCsv();};
}

document.querySelector('nav.bottom button[data-v="home"]').classList.add('active');
render();
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
let _lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-_lastTouchEnd<=300)e.preventDefault();
  _lastTouchEnd=now;
},{passive:false});
</script>
</body>
</html>
